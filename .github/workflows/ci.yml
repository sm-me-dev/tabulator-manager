name: Monorepo Continuous Integration

# Laravel package checks (composer validate, Pest on SQLite/MySQL/PostgreSQL, PHP x Laravel matrix)
# live in publish-laravel.yml so they are not duplicated here.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    name: Core Package Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @tabulator-manager/core typecheck

      - name: Vitest with coverage thresholds (>=90% lines)
        run: pnpm --filter @tabulator-manager/core test:coverage

      - name: Build core
        run: pnpm --filter @tabulator-manager/core build

      - name: Verify npm tarball contents
        run: pnpm --filter @tabulator-manager/core pack --dry-run

  apps-verification:
    name: Apps Build & Docker Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and demo (GitHub Pages base path)
        run: |
          pnpm --filter @tabulator-manager/core build
          pnpm --filter demo build
          test -f apps/demo/dist/mockServiceWorker.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Laravel demo Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/laravel-demo/Dockerfile
          push: false
          tags: tabulator-manager-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
