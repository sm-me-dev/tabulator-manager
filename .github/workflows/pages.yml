name: GitHub Pages

# Deploys apps/demo to GitHub Pages using the official Pages actions.
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - "apps/demo/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and demo
        # GITHUB_REPOSITORY is set by Actions, so vite.config.ts derives base = "/<repo>/".
        run: |
          pnpm --filter @tabulator-manager/core build
          pnpm --filter demo build

      - name: Verify Pages artifact (base path + MSW service worker)
        run: |
          set -euo pipefail
          test -f apps/demo/dist/index.html
          test -f apps/demo/dist/mockServiceWorker.js
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          grep -q "/${REPO_NAME}/assets/" apps/demo/dist/index.html \
            || { echo "index.html asset URLs are not prefixed with /${REPO_NAME}/"; exit 1; }
          touch apps/demo/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
