name: Laravel Package CI & Release Verification

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "laravel-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    name: PHP ${{ matrix.php }} | Multi-DB Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tabulator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tabulator_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, sqlite3
          coverage: none

      - name: Validate Composer configuration
        run: |
          cd packages/laravel
          composer validate --strict

      - name: Install dependencies
        run: |
          cd packages/laravel
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pest test suite (SQLite, PostgreSQL, MySQL)
        run: |
          cd packages/laravel
          ./vendor/bin/pest --colors=always

  packagist-notification:
    name: Packagist Release Verification
    needs: test-suite
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/laravel-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Packagist Webhook Update (Optional)
        if: env.PACKAGIST_TOKEN != ''
        run: |
          curl -XPOST -H'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d'{"repository":{"url":"https://github.com/tabulator-manager/tabulator-manager"}}'
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
