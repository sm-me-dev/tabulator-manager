name: Release

# Creates the GitHub Release for a version tag. npm publishing (publish-core.yml) and the
# Packagist/Composer flow (publish-laravel.yml) are triggered by the same tag push; releases
# created with GITHUB_TOKEN cannot trigger other workflows, so they must not depend on this one.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "Invalid release tag: $TAG"; exit 1; }

      - uses: actions/checkout@v4

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            PRERELEASE=""
            [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"
            gh release create "$TAG" --title "Tabulator Manager $TAG" --generate-notes $PRERELEASE
          fi
