name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          fi

      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install

      - name: Run Core Verification
        run: |
          pnpm --filter @tabulator-manager/core typecheck
          pnpm --filter @tabulator-manager/core test:coverage
          pnpm --filter @tabulator-manager/core build

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo, pdo_sqlite, sqlite3

      - name: Run Laravel Verification
        run: |
          cd packages/laravel
          composer validate --strict
          composer install --prefer-dist --no-interaction
          ./vendor/bin/pest

  create-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "${TAG}" \
            --title "Tabulator Manager ${TAG}" \
            --generate-notes
