name: Publish Core to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run publish (do not write to registry)"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write # Required for npm OIDC Trusted Publishing & Provenance

jobs:
  publish:
    name: Publish @tabulator-manager/core to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm approve-builds --all || true
          pnpm install

      - name: Run verification gate
        run: |
          pnpm --filter @tabulator-manager/core typecheck
          pnpm --filter @tabulator-manager/core test:coverage
          pnpm --filter @tabulator-manager/core build

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/core
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running pnpm publish dry run..."
            pnpm publish --dry-run --access public --no-git-checks
          else
            echo "Publishing with provenance to npm registry..."
            pnpm publish --provenance --access public --no-git-checks
          fi
