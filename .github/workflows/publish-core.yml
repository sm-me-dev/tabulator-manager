name: Publish Core to NPM

# npm Trusted Publishing (OIDC): no long-lived NPM_TOKEN is used.
# Register the publisher on npmjs.com: owner "sm-me-dev", repo "tabulator-manager",
# workflow "publish-core.yml". Provenance requires package.json repository.url to match the repo.
#
# NOTE: releases created by GITHUB_TOKEN (see release.yml) do NOT trigger `release: published`
# workflows, so this workflow triggers on the tag push itself.

on:
  push:
    tags:
      - "v*"
      - "core-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not write to the registry)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

jobs:
  publish:
    name: Publish @tabulator-manager/core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="${GITHUB_REF_NAME#core-}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @tabulator-manager/core version ${VERSION} (expected v${VERSION})"
            exit 1
          fi

      - name: Verification gate (typecheck, Vitest >=90% coverage, build)
        run: |
          pnpm --filter @tabulator-manager/core typecheck
          pnpm --filter @tabulator-manager/core test:coverage
          pnpm --filter @tabulator-manager/core build

      - name: Pack tarball
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm --filter @tabulator-manager/core pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Publish to npm
        run: |
          set -euo pipefail
          TARBALL=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish "$TARBALL" --dry-run --access public --provenance
          else
            npm publish "$TARBALL" --access public --provenance
          fi
