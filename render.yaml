services:
  - type: web
    name: tabulator-manager-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: apps/laravel-demo/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: PORT
        value: 10000
