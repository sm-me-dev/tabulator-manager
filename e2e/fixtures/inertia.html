<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inertia SSR Consumer Fixture</title>
  <style>
    .tabulator-table { width: 100%; border-collapse: collapse; }
    .tabulator-table th, .tabulator-table td { border: 1px solid #ccc; padding: 6px; }
  </style>
  <script src="/fixtures/mock-tabulator.js"></script>
</head>
<body>
  <h1>Inertia SSR Fixture</h1>
  <div id="request-counter" data-count="0"></div>

  <!-- Inertia Page Root with initial props from InertiaPresenter -->
  <div id="app" data-page='{"component":"Articles/Index","props":{"table":{"data":[{"id":10,"title":"Inertia Post 1","score":100},{"id":20,"title":"Inertia Post 2","score":200}],"meta":{"current_page":1,"per_page":2,"total":4,"last_page":2}}},"url":"/inertia"}'>
    <div id="table-inertia"></div>
    <button id="btn-inertia-filter">Filter Score >= 150</button>
  </div>

  <script type="module">
    import { mountTable, UrlStateAdapter } from "/packages/core/dist/index.js";

    window.networkFetchCount = 0;
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
      window.networkFetchCount++;
      document.getElementById('request-counter').setAttribute('data-count', String(window.networkFetchCount));
      return originalFetch.apply(this, args);
    };

    const appEl = document.getElementById("app");
    const inertiaPage = JSON.parse(appEl.dataset.page);
    const initialTable = inertiaPage.props.table;

    const tableId = "inertia_tbl";
    const adapter = new UrlStateAdapter(tableId);

    // Initial mount hydrates server props directly - 0 duplicate requests!
    const table = mountTable({
      element: "#table-inertia",
      Tabulator: window.Tabulator,
      columns: [
        { field: "id", title: "ID" },
        { field: "title", title: "Title" },
        { field: "score", title: "Score" }
      ],
      data: initialTable.data
    });

    window.inertiaTable = table;
    window.inertiaAdapter = adapter;

    document.getElementById("btn-inertia-filter").addEventListener("click", () => {
      const cur = adapter.current();
      adapter.update({
        ...cur,
        filters: [{ field: "score", operator: ">=", value: "150" }]
      });
    });
  </script>
</body>
</html>
